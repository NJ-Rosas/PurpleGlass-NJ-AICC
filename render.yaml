services:
  - type: web
    name: purpleglass-web
    runtime: docker
    plan: free
    region: oregon
    dockerContext: ./AI Call Center
    dockerfilePath: ./AI Call Center/deploy/render/Dockerfile.web
    healthCheckPath: /health/live
    autoDeployTrigger: checksPass
    numInstances: 1
    envVars:
      - key: ASPNETCORE_ENVIRONMENT
        value: Development
      - key: ConnectionStrings__Postgres
        fromDatabase:
          name: purpleglass-postgres
          property: connectionString
      - key: Mqtt__Host
        sync: false
      - key: Mqtt__Port
        value: 8883
      - key: Mqtt__UseTls
        value: true
      - key: Mqtt__Username
        sync: false
      - key: Mqtt__Password
        sync: false
      - key: Security__RequireHttps
        value: true
      - key: Security__ForceSecureCookies
        value: true
      - key: Security__AllowDevelopmentAuthentication
        value: true
      - key: Security__AllowSyntheticDataOnly
        value: true
      - key: Providers__EnableRealTelephony
        value: false
      - key: Providers__EnableRealAI
        value: false
      - key: Providers__EnableRealSpeech
        value: false
      - key: Integrations__EnableOpenDental
        value: false
      - key: DataProtection__AllowSensitiveData
        value: false
      - key: Telephony__Provider
        value: None
  - type: web
    name: purpleglass-integrations-worker
    runtime: docker
    plan: free
    region: oregon
    dockerContext: ./AI Call Center
    dockerfilePath: ./AI Call Center/deploy/render/Dockerfile.worker
    healthCheckPath: /health/live
    autoDeployTrigger: checksPass
    numInstances: 1
    envVars:
      - key: DOTNET_ENVIRONMENT
        value: Development
      - key: ConnectionStrings__Postgres
        fromDatabase:
          name: purpleglass-postgres
          property: connectionString
      - key: Mqtt__Host
        sync: false
      - key: Mqtt__Port
        value: 8883
      - key: Mqtt__UseTls
        value: true
      - key: Mqtt__Username
        sync: false
      - key: Mqtt__Password
        sync: false
      - key: Providers__EnableRealTelephony
        value: false
      - key: Telephony__Provider
        value: None
databases:
  - name: purpleglass-postgres
    plan: free
    region: oregon
    databaseName: purpleglass
    user: purpleglass
    ipAllowList: []
