services:
  - type: web
    name: purpleglass-web
    runtime: docker
    plan: free
    region: oregon
    dockerContext: ./AI Call Center
    dockerfilePath: ./AI Call Center/deploy/render/Dockerfile.web
    healthCheckPath: /health/live
    autoDeployTrigger: off
    numInstances: 1
    envVars:
      - key: AllowedHosts
        value: localhost;127.0.0.1;purpleglass-web.onrender.com
      - key: ASPNETCORE_ENVIRONMENT
        value: Development
      - key: ASPNETCORE_FORWARDEDHEADERS_ENABLED
        value: true
      - key: ConnectionStrings__Postgres
        fromDatabase:
          name: purpleglass-postgres
          property: connectionString
      - key: Mqtt__Host
        sync: false
      - key: Mqtt__Port
        value: 8883
      - key: Mqtt__UseTls
        value: true
      - key: Mqtt__Username
        sync: false
      - key: Mqtt__Password
        sync: false
      - key: Security__RequireHttps
        value: true
      - key: Security__ForceSecureCookies
        value: true
      - key: Security__AllowDevelopmentAuthentication
        value: true
      - key: Security__AllowSyntheticDataOnly
        value: true
      - key: Providers__EnableRealTelephony
        value: true
      - key: Providers__EnableRealAI
        value: false
      - key: Providers__EnableRealSpeech
        value: true
      - key: SpeechToText__Provider
        value: OpenAI
      - key: TextToSpeech__Provider
        value: OpenAI
      - key: LanguageModel__Provider
        value: Fake
      - key: Integrations__EnableOpenDental
        value: false
      - key: DataProtection__AllowSensitiveData
        value: false
      - key: Telephony__Provider
        value: Twilio
      - key: Telephony__PublicBaseUrl
        value: https://purpleglass-web.onrender.com
      - key: OpenAI__ApiKey
        sync: false
      - key: Telephony__Twilio__AccountSid
        sync: false
      - key: Telephony__Twilio__AuthToken
        sync: false
      - key: WorkerRuntime__ReadyUrl
        value: https://purpleglass-integrations-worker.onrender.com/health/ready
      - key: WorkerRuntime__ReadyTimeoutSeconds
        value: 75
      - key: WorkerRuntime__PollMilliseconds
        value: 1000
  - type: web
    name: purpleglass-integrations-worker
    runtime: docker
    plan: free
    region: oregon
    dockerContext: ./AI Call Center
    dockerfilePath: ./AI Call Center/deploy/render/Dockerfile.worker
    healthCheckPath: /health/live
    autoDeployTrigger: off
    numInstances: 1
    envVars:
      - key: DOTNET_ENVIRONMENT
        value: Development
      - key: ConnectionStrings__Postgres
        fromDatabase:
          name: purpleglass-postgres
          property: connectionString
      - key: Mqtt__Host
        sync: false
      - key: Mqtt__Port
        value: 8883
      - key: Mqtt__UseTls
        value: true
      - key: Mqtt__Username
        sync: false
      - key: Mqtt__Password
        sync: false
      - key: Providers__EnableRealTelephony
        value: true
      - key: Telephony__Provider
        value: Twilio
      - key: Telephony__PublicBaseUrl
        value: https://purpleglass-web.onrender.com
      - key: Telephony__Twilio__AccountSid
        sync: false
      - key: Telephony__Twilio__AuthToken
        sync: false
      - key: Telephony__MaximumQueueAgeSeconds
        value: 120
databases:
  - name: purpleglass-postgres
    plan: free
    region: oregon
    databaseName: purpleglass
    user: purpleglass
    ipAllowList: []
